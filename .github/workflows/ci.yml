name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Hermetic: regenerates from the committed spec, so this proves the committed node and
      # README still reproduce from it with no network. Refreshing the spec is the release
      # workflow job, never a CI job.
      - name: Codegen drift check
        env:
          ROXYAPI_SPEC_FILE: specs/openapi.json
        run: |
          npm run generate
          git diff --exit-code -- specs/openapi.json nodes/RoxyApi/spec.gen.ts nodes/RoxyApi/resources README.md \
            || { echo 'codegen drift: commit the regenerated files'; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck scripts and tests
        run: npm run typecheck

      - name: Test the built node
        run: npm test
