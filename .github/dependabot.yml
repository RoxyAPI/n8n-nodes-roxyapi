version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      dev-dependencies:
        patterns: ['*']
    ignore:
      # The n8n toolchain pins the lint rules the generated node must pass and that n8n
      # verification re-runs. A bump can change fixer output, so it moves by hand with a
      # regenerate, a lint and a dispatched release, never by dependabot.
      - dependency-name: '@n8n/node-cli'
      # eslint and typescript stay on the majors the n8n toolchain supports: its lint
      # stack pins eslint 9 and accepts typescript below 6.1.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Types track the Node major CI runs (24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
